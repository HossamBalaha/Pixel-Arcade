<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 140" width="220" height="140" role="img"
     aria-label="Domino Chain thumbnail">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="hsl(158 72% 24%)"/>
            <stop offset="100%" stop-color="hsl(180 80% 60%)"/>
        </linearGradient>
        <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0.30" stop-color="#000000" stop-opacity="0"/>
            <stop offset="1" stop-color="#000000" stop-opacity="0.42"/>
        </linearGradient>
    </defs>
    <rect width="220" height="140" rx="14" fill="url(#bg)"/>

    <circle cx="16" cy="16" r="2" fill="#ffffff" opacity="0.35"/>
    <circle cx="204" cy="16" r="2" fill="#ffffff" opacity="0.35"/>
    <circle cx="16" cy="124" r="2" fill="#ffffff" opacity="0.35"/>
    <circle cx="204" cy="124" r="2" fill="#ffffff" opacity="0.35"/>

    <g transform="rotate(-6 91 48)">
        <rect x="78" y="22" width="26" height="52" rx="5" fill="#ffffff" stroke="#0f172a" stroke-opacity="0.25"/>
        <line x1="78" y1="48" x2="104" y2="48" stroke="#0f172a" stroke-opacity="0.3" stroke-width="2"/>
        <circle cx="91" cy="34" r="2.8" fill="#0f172a"/>
        <circle cx="86" cy="61" r="2.8" fill="#0f172a"/>
        <circle cx="96" cy="61" r="2.8" fill="#0f172a"/>
    </g>
    <g transform="rotate(58 131 62)">
        <rect x="118" y="36" width="26" height="52" rx="5" fill="#ffffff" stroke="#0f172a" stroke-opacity="0.25"/>
        <line x1="118" y1="62" x2="144" y2="62" stroke="#0f172a" stroke-opacity="0.3" stroke-width="2"/>
        <circle cx="131" cy="48" r="2.8" fill="#0f172a"/>
        <circle cx="126" cy="75" r="2.8" fill="#0f172a"/>
        <circle cx="136" cy="75" r="2.8" fill="#0f172a"/>
    </g>
    <rect width="220" height="140" rx="14" fill="url(#scrim)"/>

    <text x="110" y="108" text-anchor="middle" font-size="16"
          font-weight="700" fill="#ffffff" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">Domino Chain
    </text>

    <text x="110" y="128" text-anchor="middle" font-size="8" letter-spacing="2.5"
          fill="#ffffff" fill-opacity="0.78" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">PIXEL ARCADE
    </text>
</svg>

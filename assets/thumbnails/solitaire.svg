<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 140" width="220" height="140" role="img"
     aria-label="Solitaire thumbnail">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="hsl(144 72% 24%)"/>
            <stop offset="100%" stop-color="hsl(166 80% 60%)"/>
        </linearGradient>
        <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0.30" stop-color="#000000" stop-opacity="0"/>
            <stop offset="1" stop-color="#000000" stop-opacity="0.42"/>
        </linearGradient>
    </defs>
    <rect width="220" height="140" rx="14" fill="url(#bg)"/>

    <circle cx="16" cy="16" r="2" fill="#ffffff" opacity="0.35"/>
    <circle cx="204" cy="16" r="2" fill="#ffffff" opacity="0.35"/>
    <circle cx="16" cy="124" r="2" fill="#ffffff" opacity="0.35"/>
    <circle cx="204" cy="124" r="2" fill="#ffffff" opacity="0.35"/>

    <g>
        <g transform="rotate(-14 104 48)">
            <rect x="86" y="20" width="34" height="48" rx="5" fill="#ffffff" stroke="#0f172a" stroke-opacity="0.25"/>
            <rect x="91" y="25" width="24" height="38" rx="3" fill="#1d4ed8"/>
            <rect x="94" y="28" width="18" height="32" rx="2" fill="none" stroke="#ffffff" stroke-opacity="0.55"
                  stroke-dasharray="3 3"/>
        </g>
        <g transform="rotate(9 116 50)">
            <rect x="98" y="22" width="34" height="48" rx="5" fill="#ffffff" stroke="#0f172a" stroke-opacity="0.25"/>

            <path transform="translate(115 51) scale(1.5)" fill="#dc2626"
                  d="M0 8.5 C -6 2.5, -8.5 -1, -8.5 -4 C -8.5 -6.5, -6.6 -8.2, -4.4 -8.2
           C -2.4 -8.2, -0.9 -7, 0 -5.2 C 0.9 -7, 2.4 -8.2, 4.4 -8.2
           C 6.6 -8.2, 8.5 -6.5, 8.5 -4 C 8.5 -1, 6 2.5, 0 8.5 Z"/>
        </g>
    </g>
    <rect width="220" height="140" rx="14" fill="url(#scrim)"/>

    <text x="110" y="108" text-anchor="middle" font-size="16"
          font-weight="700" fill="#ffffff" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">Solitaire
    </text>

    <text x="110" y="128" text-anchor="middle" font-size="8" letter-spacing="2.5"
          fill="#ffffff" fill-opacity="0.78" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">PIXEL ARCADE
    </text>
</svg>
